<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>kjr-browser toolbar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="tabbar">
    <div id="tabs"></div>
    <button id="new-tab" title="新しいタブ">+</button>
  </div>
  <nav id="navbar">
    <button id="back" title="戻る">←</button>
    <button id="forward" title="進む">→</button>
    <button id="reload" title="再読み込み">⟳</button>
    <input id="address" type="text" spellcheck="false"
           placeholder="URL または検索ワードを入力して Enter" />
  </nav>
  <script src="main.js"></script>
</body>
</html>
