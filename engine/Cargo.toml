[package]
name = "kjr-engine"
version = "0.1.0"
description = "ブラウザの仕組みを理解するためのフルスクラッチ・トイエンジン"
edition = "2021"

[dependencies]
# ウィンドウとイベントループ (OS からの入力・描画タイミングをもらう)
winit = "0.30"
# ウィンドウにピクセルバッファを直接書き込む (GPU を使わない最小の表示手段)
softbuffer = "0.4"
# CPU ラスタライザ (図形 → ピクセルの変換)
tiny-skia = "0.11"
# フォントラスタライザ (文字 → グリフ画像の変換)
fontdue = "0.9"
